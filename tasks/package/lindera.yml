---
- name: Get latest release
  when: lindera_version | default('latest') == 'latest'
  block:
    - name: Get latest version
      ansible.builtin.include_tasks:
        file: common/get_latest_version.yml
      vars:
        github_repo: "{{ tools_lindera_repo }}"
        target_name: lindera
    - name: Set package version
      ansible.builtin.set_fact:
        lindera_version: "{{ latest_version }}"
- name: Set variable
  ansible.builtin.set_fact:
    asset_file: lindera-{{ ansible_facts['architecture'] }}-unknown-linux-gnu-{{ lindera_version[1:] }}.zip
- name: Install lindera
  ansible.builtin.unarchive:
    src: https://github.com/{{ tools_lindera_repo }}/releases/download/{{ lindera_version }}/{{ asset_file }}
    dest: /usr/local/bin
    remote_src: true
- name: Download lindera dictionary
  ansible.builtin.command:
    cmd: /usr/local/bin/lindera download {{ lindera_dictionary }}
  register: install_lindera_dictionary
  ## lindera download は取得済みの辞書があると何もせず終了するため、その通知の有無で変更を判定する
  changed_when: "'is already downloaded' not in install_lindera_dictionary.stderr"
