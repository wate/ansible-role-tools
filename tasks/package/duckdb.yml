---
- name: Set Install version variable
  when: duckdb_version == 'latest'
  block:
    - name: Get latest version
      ansible.builtin.include_tasks:
        file: common/get_latest_version.yml
      vars:
        github_repo: "{{ tools_duckdb_repo }}"
        target_name: duckdb
    - name: Set package version
      ansible.builtin.set_fact:
        duckdb_version: "{{ latest_version }}"
- name: Set package file variable
  ansible.builtin.set_fact:
    duckdb_asset_file: "{{ duckdb_asset_prefix }}-linux-{{ arch_type_maps[ansible_facts['architecture']] }}{{ duckdb_asset_extension }}"
  vars:
    ## アセット名はv2.0.0を境に`duckdb_cli-linux-<arch>.zip`から`duckdb-cli-linux-<arch>.tar.gz`へ変更された
    duckdb_asset_name_changed: "{{ (duckdb_version | regex_replace('^v', '')) is version('2.0.0', '>=') }}"
    duckdb_asset_prefix: "{{ duckdb_asset_name_changed | ternary('duckdb-cli', 'duckdb_cli') }}"
    duckdb_asset_extension: "{{ duckdb_asset_name_changed | ternary('.tar.gz', '.zip') }}"
    arch_type_maps:
      x86_64: amd64
      aarch64: arm64
- name: Install duckdb
  ansible.builtin.unarchive:
    src: https://github.com/{{ tools_duckdb_repo }}/releases/download/{{ duckdb_version }}/{{ duckdb_asset_file }}
    dest: /usr/local/bin
    include:
      - duckdb
    remote_src: true
